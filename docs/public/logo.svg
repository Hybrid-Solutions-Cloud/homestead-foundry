<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Homestead Foundry">
  <title>Homestead Foundry</title>
  <defs>
    <linearGradient id="hf-shell" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B93E8"/>
      <stop offset="1" stop-color="#0B4A8F"/>
    </linearGradient>
    <linearGradient id="hf-flame" x1="32" y1="13" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="0.55" stop-color="#F98A2B"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
    <linearGradient id="hf-core" x1="32" y1="30" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
  </defs>

  <!-- The crucible: a hexagon, the shape Azure uses for a resource. -->
  <path d="M32 4 L56.2 18 L56.2 46 L32 60 L7.8 46 L7.8 18 Z" fill="url(#hf-shell)"/>
  <path d="M32 4 L56.2 18 L56.2 46 L32 60 L7.8 46 L7.8 18 Z" fill="none" stroke="#0A3A70" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- The forge flame. -->
  <path d="M32 13 C 41 24, 45 30, 45 38.5 C 45 46, 39.2 52, 32 52 C 24.8 52, 19 46, 19 38.5 C 19 32, 22 28, 25.5 23 C 26.5 29, 29 32, 31 34 C 31.5 27, 31 20, 32 13 Z" fill="url(#hf-flame)"/>
  <path d="M32 30 C 36 35, 38 38.5, 38 42 C 38 45.9, 35.3 49, 32 49 C 28.7 49, 26 45.9, 26 42 C 26 38.5, 28 35, 32 30 Z" fill="url(#hf-core)"/>
</svg>
